<!doctype html>
<html lang="fa" dir="rtl" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دانشگاه صنعتی وزیر - سامانه جامع دانشجویی</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <style>
      html.theme-dark body {
        background-color: #0F172A;
        color: #FFFFFF;
      }
      html.theme-light body {
        background-color: #E6FAFC;
        color: #0F172A;
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('app-theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.remove('theme-dark', 'theme-light', 'dark', 'light');
          root.classList.add(theme === 'light' ? 'theme-light' : 'theme-dark');
          root.style.colorScheme = theme;
          root.dataset.theme = theme;
        } catch (e) {
          document.documentElement.classList.add('theme-dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
      // Unregister any active service workers and clear cache storage from previous PWA installations
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if (typeof window !== 'undefined' && 'caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            caches.delete(key);
          });
        });
      }
    </script>
  </head>
  <body class="font-['Vazirmatn',sans-serif] antialiased selection:bg-[var(--accent)] selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
